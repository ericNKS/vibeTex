<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#glow)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Document Page Symbol -->
  <g filter="url(#shadow)" opacity="0.95">
    <path d="M140 120 C140 108 149 98 161 98 L300 98 L372 170 L372 390 C372 402 363 412 351 412 L161 412 C149 412 140 402 140 390 Z" fill="#0f172a" fill-opacity="0.55" stroke="#6366f1" stroke-width="3"/>
    <path d="M300 98 L300 158 C300 164 306 170 312 170 L372 170" fill="#1e293b" stroke="#6366f1" stroke-width="2.5"/>
  </g>

  <!-- LaTeX Math Symbols & Grid Accent lines -->
  <path d="M180 200 L260 200" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M180 230 L330 230" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M180 260 L310 260" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Stylized Elegant 'V' with Vibrance Glow -->
  <g filter="url(#shadow)">
    <path d="M176 170 L242 344 C248 360 264 360 270 344 L336 170" fill="none" stroke="url(#accent)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Spark / Energy dot -->
    <circle cx="256" cy="354" r="10" fill="#38bdf8"/>
  </g>

  <!-- Small TeX subtext badge -->
  <g transform="translate(216, 280)">
    <text x="40" y="88" font-family="DejaVu Serif, Times New Roman, serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">TeX</text>
  </g>
</svg>